<html lang="en">
<head>

<title>My Knee — Pain Journal & JournalSpeak</title>
<style>
:root{color-scheme:dark;--bg:#101b20;--panel:#19272d;--panel2:#203239;--line:#304349;--muted:#a4b9bc;--text:#f1f6f2;--accent:#a8e1b1;--accent2:#78bea2;--cream:#f5d9ac;--danger:#ffb4a9;--radius:19px}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1d3c39 0%,#101b20 48%) fixed;color:var(--text);line-height:1.5;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.layout{max-width:970px;margin:auto;padding:0 24px 132px}.header{background:#101b20ed;backdrop-filter:blur(14px);border-bottom:1px solid #2a4246;position:sticky;top:0;z-index:10}.header-inner{max-width:970px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{height:44px;width:44px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#b2e8b1,#68b6a2);color:#152823;font-size:24px;font-weight:850}.brand-title{font-weight:850;letter-spacing:-.5px;font-size:19px}.brand-caption{font-size:11px;color:var(--muted);margin-top:-3px}.privacy{color:#c0dace;border:1px solid #46685a;background:#21352f;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:750}.hero{padding:37px 0 24px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:850}.hero h1{font-size:clamp(29px,4.6vw,45px);line-height:1.07;letter-spacing:-1.7px;margin:8px 0 12px}.hero p{margin:0;color:var(--muted);max-width:650px;font-size:14px}.tabs{display:flex;gap:7px;padding:6px;background:#17272d;border:1px solid var(--line);border-radius:17px;margin:8px 0 23px;flex-wrap:wrap}.tab{flex:1;min-width:130px;border:0;background:transparent;color:var(--muted);padding:12px 13px;border-radius:12px;font-size:13px;font-weight:800}.tab.active{background:#b2e1b5;color:#14251f;box-shadow:0 5px 16px #0004}.twocol{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.85fr);align-items:start;gap:19px}.card{background:linear-gradient(140deg,#1c2b30,#19262b);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 12px 35px #0001}.card h2{font-size:20px;letter-spacing:-.5px;margin:0 0 7px}.card h3{font-size:16px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:3px 0 18px}.field{margin:17px 0}.field label,.field legend{display:block;font-size:12px;font-weight:780;margin-bottom:9px;color:#dae9e5}.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input,.textarea,.select{display:block;width:100%;padding:13px 14px;background:#122127;border:1px solid #455b61;border-radius:12px;color:var(--text);min-height:44px}.textarea{min-height:124px;resize:vertical;line-height:1.65}.textarea.journal{min-height:330px;font-size:15px;padding:18px;line-height:1.75;border-color:#58766a;background:#12221f}.input::placeholder,.textarea::placeholder{color:#8fa5a8}.pain-row{background:#14242a;border:1px solid #32494f;padding:15px;border-radius:14px;margin:10px 0}.pain-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;font-size:14px;font-weight:720}.score{font-size:22px;font-weight:850;color:var(--accent);font-variant-numeric:tabular-nums}.range{width:100%;accent-color:#9de0b4}.range-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.btn{border:0;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 17px;background:var(--accent);color:#14251f;border-radius:12px;font-weight:850;font-size:13px}.btn:hover{filter:brightness(1.04)}.btn.secondary{background:#293d41;color:#e1eeeb;border:1px solid #4a6364}.btn.ghost{background:transparent;color:var(--muted);border:1px solid #475a5c}.btn.danger{background:#402d32;color:#ffc8c2;border:1px solid #81565a}.btn.small{padding:9px 11px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.btn.fill{width:100%}.notice{padding:14px 15px;border:1px solid #365b4b;background:#20372f;border-radius:13px;font-size:12px;color:#d0e9d6;line-height:1.6}.notice.warning{background:#312e29;border-color:#716046;color:#edddbe}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.stat{padding:14px;background:#14252a;border:1px solid #35474d;border-radius:13px}.stat strong{display:block;font-size:24px;line-height:1.1;letter-spacing:-.5px}.stat span{font-size:11px;color:var(--muted)}.mini-note{font-size:11px;color:var(--muted);line-height:1.6}.entry{padding:15px 0;border-top:1px solid #2c4246}.entry:first-child{border-top:0}.entry-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.entry-title strong{font-size:13px}.entry-meta{color:var(--muted);font-size:11px;margin-top:4px}.entry-note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#d8e5e1;line-height:1.55;margin:9px 0}.entry-actions{display:flex;gap:11px;margin-top:9px}.linkbtn{background:transparent;border:0;padding:4px 0;color:var(--accent);font-size:12px;font-weight:790}.linkbtn.dangertext{color:var(--danger)}.tag{font-size:11px;display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:30px;background:#29423b;color:#b5e6c7;font-weight:800}.empty{padding:29px 16px;text-align:center;border:1px dashed #4f6366;border-radius:15px;color:var(--muted);font-size:13px}.journal-top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:15px}.secret{display:flex;align-items:center;gap:8px;color:#d0ebd6;font-size:12px;font-weight:750}.promptbox{background:#22332f;border-left:3px solid var(--accent);padding:16px;border-radius:0 12px 12px 0;margin-bottom:17px}.promptbox strong{font-size:13px}.promptbox p{margin:5px 0 0;font-size:13px;color:#c3d7cc}.wordcount{font-size:11px;color:var(--muted);margin:8px 0 15px;text-align:right}.journal-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.journal-words{color:var(--muted);font-size:12px}.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.graph{width:100%;height:auto;display:block;max-height:230px}.progress-line{stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-top:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.footnote{margin:24px auto 0;font-size:12px;color:#a0b8b4;line-height:1.7}.footer{margin-top:22px;padding:16px 0;border-top:1px solid var(--line);font-size:11px;color:#90aaa7}.toast{position:fixed;z-index:100;bottom:23px;left:50%;transform:translateX(-50%);background:#c6e8bd;color:#12231c;padding:12px 17px;border-radius:12px;font-size:12px;font-weight:850;box-shadow:0 12px 38px #0009;max-width:min(90vw,450px);text-align:center}.inline-icon{font-size:17px}.settings-box{margin:12px 0 22px;padding:17px;background:#15252a;border:1px solid #30474e;border-radius:14px}.settings-box h3{margin:0 0 8px}.tiny{font-size:11px;color:var(--muted)}.settings-box .actions{margin-top:15px}.mobile-nav{display:none}.hide{display:none!important}@media(max-width:700px){.layout{padding:0 16px 110px}.header-inner{padding:12px 16px}.privacy{font-size:10px}.hero{padding:29px 0 20px}.twocol,.history-grid{grid-template-columns:1fr}.card{padding:18px}.tabs{display:none}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);z-index:40;background:#132327f7;backdrop-filter:blur(16px);border-top:1px solid #3a4e52;padding:8px 5px calc(10px + env(safe-area-inset-bottom))}.mobile-nav .tab{padding:10px 5px;min-width:0;font-size:10px;display:flex;flex-direction:column;gap:3px}.mobile-nav .tab .ico{font-size:17px}.mobile-nav .tab.active{box-shadow:none}.textarea.journal{min-height:310px}.card h2{font-size:19px}}@media(max-width:360px){.fields2{grid-template-columns:1fr}.brand-title{font-size:17px}.privacy{display:none}}

/* Clear, responsive load guidance that updates with pain sliders. */
.load-guide{border:1px solid #49645c;background:#182a2c;border-radius:14px;padding:15px 16px;margin:18px 0 22px}
.load-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:8px}
.load-header strong{font-size:14px}
.load-score{font-size:13px;font-weight:850;color:#d2e6de;font-variant-numeric:tabular-nums}
.load-guide h3{font-size:18px;margin:0 0 5px}
.load-guide p{font-size:12px;line-height:1.65;color:#c6dad2;margin:0}
.load-guide.increase{border-color:#559c71;background:#1c342b}
.load-guide.maintain{border-color:#ad9455;background:#332e23}
.load-guide.reduce{border-color:#b96d6d;background:#37262b}
.load-rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:14px}
.load-rule{border:1px solid #3e5456;border-radius:10px;padding:9px 5px;text-align:center;font-size:11px;color:#aec9c4}
.load-rule strong{display:block;font-size:14px;color:#e5f0eb}
.load-rule.selected{outline:2px solid #a8e1b1;outline-offset:0;background:#2d4437;color:#f2fff4}
.load-guide.maintain .load-rule.selected{outline-color:#e8c779;background:#4c4027}
.load-guide.reduce .load-rule.selected{outline-color:#f3aaa9;background:#4d3036}
.load-tag{display:inline-flex;font-weight:780;font-size:11px;border-radius:999px;padding:4px 9px;background:#29413a;color:#bce7c9}
.load-tag.maintain{background:#54432a;color:#f2d69c}
.load-tag.reduce{background:#5a3438;color:#ffbfbc}
.load-tag.increase{background:#274536;color:#baf1c9}
@media(max-width:380px){.load-rules{gap:4px}.load-rule{padding:9px 2px;font-size:10px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="brand"><div class="logo" aria-hidden="true">⌁</div><div><div class="brand-title">MY KNEE</div><div class="brand-caption">A space for recovery</div></div></div><span class="privacy">◈ Stored on this device</span></div></header>
<main class="layout">
<section class="hero"><span class="eyebrow" id="eyebrow">PAIN JOURNAL</span><h1 id="pageTitle">How do your knees feel today?</h1><p id="pageDescription">Track your symptoms and use your pain score to guide training load.</p></section>
<nav class="tabs" aria-label="Pages"><button type="button" class="tab active" data-tab="log">Log pain</button><button type="button" class="tab" data-tab="journal">JournalSpeak</button><button type="button" class="tab" data-tab="history">History</button><button type="button" class="tab" data-tab="settings">Settings</button></nav>
<div id="view" aria-live="off"></div>
<div class="footer">My Knee · Private journal · No account, tracking, or automatic cloud backup</div>
</main>
<nav class="mobile-nav" aria-label="Mobile navigation"><button type="button" class="tab active" data-tab="log"><span class="ico">◉</span>Log pain</button><button type="button" class="tab" data-tab="journal"><span class="ico">✎</span>Write</button><button type="button" class="tab" data-tab="history"><span class="ico">▥</span>History</button><button type="button" class="tab" data-tab="settings"><span class="ico">⚙</span>Settings</button></nav>
<script>
'use strict';
(() => {
  'use strict';
  // Retain the existing v2 storage key so an update never loses saved pain notes.
  const STORE = 'mijn-knie-journal-v1';
  const OLD = 'mijn-gym-state-v1';
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const today = () => {const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
  const nowTime = () => {const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
  const identifier = () => typeof crypto!=='undefined' && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const fmtDate = date => {const p=String(date||'').split('-').map(Number); const d=p.length===3?new Date(p[0],p[1]-1,p[2]):new Date(); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
  const pain = n => Math.max(0, Math.min(10, Math.round(Number(n)||0)));
  // Conservative choice for two knees: use the higher reported pain score.
  function loadAdvice(left,right){
    const score=Math.max(pain(left),pain(right));
    if(score<4) return {score,level:'increase',title:'Consider a small load increase',short:'Increase gradually',text:'Your score is below 4/10. You may increase training load a little if your pain and stiffness are not worse the next morning.'};
    if(score<=6) return {score,level:'maintain',title:'Keep your load the same',short:'Maintain load',text:'Your score is 4–6/10. Keep your current load steady and monitor your response over the next 24 hours.'};
    return {score,level:'reduce',title:'Reduce your load',short:'Reduce load',text:'Your score is above 6/10. Reduce weight, depth or volume. If pain is severe, unusual or persists, seek medical advice.'};
  }
  let data={version:1,entries:[],legacyImported:false};
  try {const raw=localStorage.getItem(STORE); if(raw){const existing=JSON.parse(raw);if(Array.isArray(existing.entries)) data={version:1,entries:existing.entries,legacyImported:!!existing.legacyImported};}} catch(e) {}
  let page='log', editingId=null;
  function notify(message){$('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=message;document.body.append(n);setTimeout(()=>n.remove(),4200)}
  function save(){try{localStorage.setItem(STORE,JSON.stringify(data));return true}catch(e){notify('Could not save. Check your browser storage or available space.');return false}}
  const sorted=()=>[...data.entries].sort((a,b)=>(String(b.date||'')+String(b.time||'')).localeCompare(String(a.date||'')+String(a.time||'')));
  function countWeek(){const d=new Date();d.setDate(d.getDate()-6);const cutoff=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;return data.entries.filter(e=>e.date>=cutoff).length}
  const enContexts={'Bij traplopen':'On stairs','Na krachttraining':'After strength training','Tijdens of na padel':'During or after padel','Bij opstaan':'On waking','In rust':'At rest','Anders':'Other','Overgenomen uit Gym Tracker':'Imported from Gym Tracker'};
  function contextText(ctx){return enContexts[ctx] || ctx}
  function adviceTag(left,right){const a=loadAdvice(left,right);return `<span class="load-tag ${a.level}" title="Based on higher knee pain score: ${a.score}/10">${a.short}</span>`;}
  function entryCard(e,withActions=true){return `<article class="entry"><div class="entry-title"><strong>${esc(fmtDate(e.date))}${e.time?` · ${esc(e.time)}`:''}</strong><span class="tag">L ${pain(e.left)}/10 · R ${pain(e.right)}/10</span></div><div class="entry-meta" style="margin-top:8px">${adviceTag(e.left,e.right)}</div>${e.context?`<div class="entry-meta">${esc(contextText(e.context))}</div>`:''}${e.description?`<div class="entry-note">${esc(e.description)}</div>`:''}${e.stiffness!==null&&e.stiffness!==undefined&&e.stiffness!==''?`<div class="entry-meta">Morning stiffness: ${Number(e.stiffness)} min</div>`:''}${withActions?`<div class="entry-actions"><button type="button" class="linkbtn" data-action="edit" data-id="${esc(e.id)}">Edit</button><button type="button" class="linkbtn dangertext" data-action="remove" data-id="${esc(e.id)}">Delete</button></div>`:''}</article>`}
  function guideHTML(left,right){const a=loadAdvice(left,right);return `<section id="loadGuide" class="load-guide ${a.level}" aria-label="Training load guidance" aria-live="polite"><div class="load-header"><strong>Training load guidance</strong><span class="load-score" id="loadScore">Higher knee: ${a.score}/10</span></div><h3 id="loadTitle">${a.title}</h3><p id="loadExplanation">${a.text}</p><div class="load-rules"><div class="load-rule ${a.level==='increase'?'selected':''}" data-rule="increase"><strong>0–3</strong>Increase</div><div class="load-rule ${a.level==='maintain'?'selected':''}" data-rule="maintain"><strong>4–6</strong>Maintain</div><div class="load-rule ${a.level==='reduce'?'selected':''}" data-rule="reduce"><strong>7–10</strong>Reduce</div></div></section>`}
  const contexts=['On stairs','After strength training','During or after padel','On waking','At rest','Other'];
  function renderLog(){const recent=sorted(), current=editingId?data.entries.find(e=>e.id===editingId):null;const left=pain(current?.left),right=pain(current?.right);return `<div class="twocol"><section class="card"><h2>${current?'Edit pain entry':'New pain entry'}</h2><p class="sub">Record your knee symptoms, such as pain on stairs, after training or in the morning. An entry is saved only when you press Save.</p><form id="painForm"><div class="fields2"><div class="field"><label for="logDate">Date</label><input class="input" id="logDate" name="date" type="date" required value="${esc(current?.date||today())}"></div><div class="field"><label for="logTime">Time</label><input class="input" id="logTime" name="time" type="time" value="${esc(current?.time||nowTime())}"></div></div>
  <div class="pain-row"><div class="pain-head"><label for="leftPain">Left knee</label><output class="score" id="leftValue">${left}</output></div><input class="range" id="leftPain" name="left" type="range" min="0" max="10" step="1" value="${left}"><div class="range-ends"><span>0 · No pain</span><span>10 · Worst pain</span></div></div>
  <div class="pain-row"><div class="pain-head"><label for="rightPain">Right knee</label><output class="score" id="rightValue">${right}</output></div><input class="range" id="rightPain" name="right" type="range" min="0" max="10" step="1" value="${right}"><div class="range-ends"><span>0 · No pain</span><span>10 · Worst pain</span></div></div>
  ${guideHTML(left,right)}
  <div class="field"><label for="context">When do you notice the pain? (optional)</label><select class="select" id="context" name="context"><option value="">Choose a situation</option>${contexts.map(ctx=>`<option value="${esc(ctx)}" ${contextText(current?.context)===ctx?'selected':''}>${ctx}</option>`).join('')}</select></div>
  <div class="field"><label for="description">Describe the pain</label><textarea class="textarea" id="description" name="description" maxlength="4000" placeholder="For example: sharp pain below my right kneecap going downstairs. My knee felt stiffer this morning.">${esc(current?.description||'')}</textarea></div>
  <div class="field"><label for="stiffness">Morning stiffness in minutes (optional)</label><input class="input" id="stiffness" type="number" name="stiffness" min="0" max="600" inputmode="numeric" placeholder="e.g. 10" value="${current?.stiffness??''}"></div>
  <div class="actions"><button class="btn" type="submit">${current?'Save changes':'Save pain entry'} <span aria-hidden="true">→</span></button>${current?'<button class="btn ghost" type="button" data-action="cancel-edit">Cancel</button>':''}</div></form></section>
  <aside class="card"><span class="eyebrow">YOUR OVERVIEW</span><h2 style="margin-top:8px">One day at a time</h2><div class="stat-grid"><div class="stat"><strong>${data.entries.length}</strong><span>saved entries</span></div><div class="stat"><strong>${countWeek()}</strong><span>in the past 7 days</span></div></div><div class="notice">Pain entries are stored <strong>on this device only</strong>. Export backups in Settings. JournalSpeak writing is intentionally not saved.</div><h3 style="margin-top:23px">Latest entry</h3>${recent.length?entryCard(recent[0],false):'<div class="empty">No pain entries yet. Start with a short note.</div>'}<button class="btn secondary fill small" type="button" data-action="goto" data-page="history" style="margin-top:15px">View history</button><p class="mini-note" style="margin-top:18px">The load guide uses the <strong>higher</strong> of your two knee pain scores, and your own 0–3 / 4–6 / 7–10 rule. This is a planning prompt, not a medical clearance. Consider symptoms during activity and the following morning before increasing.</p></aside></div>`}
  function renderJournal(){return `<div class="twocol"><section class="card"><div class="journal-top"><div><h2>JournalSpeak</h2><p class="sub" style="margin:0">Write freely, then let it go.</p></div><div class="secret">◈ Not saved</div></div><div class="promptbox"><strong>What's on your mind today?</strong><p>Write about feelings, worries, anger or frustration without editing yourself. You don't have to read it back.</p></div><label for="journalText" class="eyebrow" style="display:block;margin-bottom:10px">YOUR PRIVATE WRITING SPACE</label><textarea id="journalText" class="textarea journal" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="Write whatever comes to mind. There's no need to explain or make it sound good…" aria-describedby="journalPrivacy"></textarea><div id="wordCount" class="wordcount">0 words</div><div class="journal-foot"><button type="button" class="btn danger" data-action="clear-journal">✕ Clear writing</button><span class="journal-words">Not in history · Not in backups</span></div><p id="journalPrivacy" class="mini-note" style="margin-top:16px">This app does not save JournalSpeak text. Once you clear it or leave this page, you cannot retrieve it from the app. Your browser or keyboard may have its own text-input features.</p></section><aside class="card"><span class="eyebrow">A GENTLE PROMPT</span><h2 style="margin-top:9px">Write without judgment</h2><p class="sub">JournalSpeak is an optional way to reflect. You don't have to write every day or force yourself to feel anything.</p><div class="settings-box"><h3>Not sure where to start?</h3><p class="sub" style="margin-bottom:0">• What has been bothering me?<br>• What have I kept to myself today?<br>• What do I need right now?</p></div><div class="notice warning">Writing may help with coping, but it does not mean your knee pain is psychological. It is not a replacement for assessment or treatment of knee problems.</div></aside></div>`}
  function chart(){const entries=sorted().slice(0,14).reverse();if(entries.length<2)return '<div class="empty">A trend chart will appear after two entries.</div>';const w=660,h=210,left=34,right=630,top=18,bottom=173;const x=i=>left+(right-left)*(i/Math.max(1,entries.length-1));const y=v=>bottom-(bottom-top)*pain(v)/10;const points=k=>entries.map((e,i)=>`${x(i)},${y(e[k])}`).join(' ');return `<svg class="graph" viewBox="0 0 ${w} ${h}" role="img" aria-label="Pain scores for last ${entries.length} entries"><line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}" stroke="#577176"/><line x1="${left}" y1="${y(5)}" x2="${right}" y2="${y(5)}" stroke="#577176" stroke-dasharray="5 5"/><text x="4" y="${y(10)+4}" font-size="12" fill="#a4b9bc">10</text><text x="11" y="${y(5)+4}" font-size="12" fill="#a4b9bc">5</text><text x="11" y="${bottom+4}" font-size="12" fill="#a4b9bc">0</text><polyline class="progress-line" stroke="#a8e1b1" points="${points('left')}"/><polyline class="progress-line" stroke="#f5d9ac" points="${points('right')}"/>${entries.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.left)}" r="4" fill="#a8e1b1"/><circle cx="${x(i)}" cy="${y(e.right)}" r="4" fill="#f5d9ac"/>`).join('')}<text x="${left}" y="202" font-size="11" fill="#a4b9bc">${esc(fmtDate(entries[0].date))}</text><text x="${right}" y="202" text-anchor="end" font-size="11" fill="#a4b9bc">${esc(fmtDate(entries.at(-1).date))}</text></svg><div class="legend"><span><i class="dot" style="background:#a8e1b1"></i>Left</span><span><i class="dot" style="background:#f5d9ac"></i>Right</span></div><p class="mini-note">Last ${entries.length} entries. The chart helps you spot patterns but does not explain the cause of pain.</p>`}
  function renderHistory(){return `<div class="twocol"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Your pain entries</h2><span class="tag">${data.entries.length} total</span></div>${data.entries.length?sorted().map(e=>entryCard(e,true)).join(''):'<div class="empty">You haven\'t saved any pain entries yet.</div>'}</section><aside class="card"><h2>Pain trend</h2><p class="sub">Your recent left and right knee pain scores.</p>${chart()}<button class="btn secondary fill small" type="button" data-action="goto" data-page="log" style="margin-top:17px">+ New pain entry</button></aside></div>`}
  function oldChecks(){try{const o=JSON.parse(localStorage.getItem(OLD)||'{}');return Array.isArray(o.checks)?o.checks:[]}catch(e){return []}}
  function renderSettings(){const count=oldChecks().length;return `<div class="twocol"><section class="card"><h2>Backup & restore</h2><p class="sub">Your pain entries are stored locally in this browser. Download backups regularly; there is no cloud account or automatic syncing.</p><div class="settings-box"><h3>Save a copy of your data</h3><p class="sub">The JSON backup contains your saved pain entries, but <strong>never your JournalSpeak writing</strong>.</p><div class="actions"><button type="button" class="btn" data-action="export-json">↓ Download backup (JSON)</button><button type="button" class="btn secondary" data-action="export-csv">↓ Export CSV</button></div></div><div class="settings-box"><h3>Restore from backup</h3><p class="sub">Import a previously saved JSON file. This will replace all pain entries on this device.</p><button type="button" class="btn secondary" data-action="import">↑ Import JSON backup</button><input class="hide" type="file" id="fileImport" accept=".json,application/json"></div><div class="settings-box"><h3>Import old knee checks</h3><p class="sub">If your previous Gym Tracker data is still available in this browser, you can import its knee checks without changing the old workout history.</p>${count?`<button class="btn secondary" type="button" data-action="legacy-import">Import ${count} old knee checks</button>`:'<p class="mini-note">No old knee checks found in this browser.</p>'}</div></section><aside class="card"><span class="eyebrow">PRIVACY</span><h2 style="margin-top:7px">You're in control</h2><div class="notice">No account, no external database connection, and no automatic transfer of your notes to Strong or GitHub. Only the website code is hosted on GitHub.</div><p class="sub" style="margin-top:15px">Data normally survives updates on the same website in the same browser. Clearing browser data or losing your device can permanently remove your local pain history.</p><h3 style="margin-top:21px">Delete entries</h3><p class="sub">This only deletes entries from this app. It does not affect the old Gym Tracker data.</p><button type="button" class="btn danger small" data-action="delete-all">Delete all pain entries</button></aside></div>`}
  const pageMeta={
    log:['PAIN JOURNAL','How do your knees feel today?','Track your symptoms and use your pain score to guide training load.'],
    journal:['JOURNALSPEAK','Write it out, then let go.','A private space for writing freely, without saving your text.'],
    history:['HISTORY','Your recovery, in your own words.','Review previous notes and see how your pain scores change over time.'],
    settings:['SETTINGS','Your data, your choice.','Export backups, import your notes or delete saved entries.']
  };
  function render(){const [eye,title,desc]=pageMeta[page];$('#eyebrow').textContent=eye;$('#pageTitle').textContent=title;$('#pageDescription').textContent=desc;$$('[data-tab]').forEach(node=>{const active=node.dataset.tab===page;node.classList.toggle('active',active);node.setAttribute('aria-current',active?'page':'false')});$('#view').innerHTML=({log:renderLog,journal:renderJournal,history:renderHistory,settings:renderSettings})[page]();}
  function navigate(target){if(!pageMeta[target]||target===page)return;const textarea=$('#journalText');if(page==='journal'&&textarea?.value.trim()&&!confirm('JournalSpeak writing is not saved and will disappear if you leave this page. Continue?'))return;page=target;render();window.scrollTo(0,0)}
  function updateAdvice(){const guide=$('#loadGuide');if(!guide)return;const a=loadAdvice($('#leftPain')?.value,$('#rightPain')?.value);guide.className=`load-guide ${a.level}`;$('#loadScore').textContent=`Higher knee: ${a.score}/10`;$('#loadTitle').textContent=a.title;$('#loadExplanation').textContent=a.text;$$('[data-rule]',guide).forEach(el=>el.classList.toggle('selected',el.dataset.rule===a.level));}
  function download(filename,body,type){const url=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
  function csvField(v){let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
  function jsonExport(){download(`my-knee-backup-${today()}.json`,JSON.stringify({...data,exportedAt:new Date().toISOString(),app:'my-knee-v3'},null,2),'application/json');notify('Backup downloaded. Store it somewhere safe.')}
  function csvExport(){const headers=['Date','Time','Left knee 0-10','Right knee 0-10','Situation','Pain description','Morning stiffness (min)'];const lines=[headers.map(csvField).join(';'),...sorted().map(e=>[e.date,e.time,e.left,e.right,contextText(e.context),e.description,e.stiffness].map(csvField).join(';'))];download(`my-knee-${today()}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');notify('CSV file downloaded.')}
  function cleanEntry(raw){if(!raw||typeof raw!=='object')return null;const d=String(raw.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;return {id:String(raw.id||identifier()).slice(0,120),date:d,time:/^\d{2}:\d{2}$/.test(raw.time||'')?raw.time:'',left:pain(raw.left),right:pain(raw.right),context:String(raw.context||'').slice(0,120),description:String(raw.description||'').slice(0,4000),stiffness:raw.stiffness==null||raw.stiffness===''?null:Math.max(0,Math.min(600,Number(raw.stiffness)||0)),legacyId:raw.legacyId?String(raw.legacyId):undefined}}
  function importLegacy(){const checks=oldChecks();if(!checks.length)return notify('No old knee checks found.');const existing=new Set(data.entries.map(e=>e.legacyId).filter(Boolean));let added=0;for(const [i,c] of checks.entries()){const legacyId='mijn-gym:'+String(c.id||c.date||i);if(existing.has(legacyId))continue;const entry=cleanEntry({id:identifier(),date:c.date,time:'',left:c.left,right:c.right,description:c.notes||'',context:'Imported from Gym Tracker',stiffness:c.stiffness,legacyId});if(entry){data.entries.push(entry);added++}}data.legacyImported=true;save();render();notify(`${added} old knee checks imported. Workout history was not changed.`)}
  function onClick(event){const tab=event.target.closest('[data-tab]');if(tab){navigate(tab.dataset.tab);return}const btn=event.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;
    if(action==='goto'){navigate(btn.dataset.page);return}
    if(action==='clear-journal'){const j=$('#journalText');if(!j)return;j.value='';$('#wordCount').textContent='0 words';j.focus();notify('Writing cleared. It was not saved.');return}
    if(action==='edit'){editingId=id;page='log';render();window.scrollTo(0,0);$('#description')?.focus();return}
    if(action==='cancel-edit'){editingId=null;render();return}
    if(action==='remove'){if(!confirm('Delete this pain entry?'))return;data.entries=data.entries.filter(e=>e.id!==id);save();render();notify('Pain entry deleted.');return}
    if(action==='export-json'){jsonExport();return}
    if(action==='export-csv'){csvExport();return}
    if(action==='import'){$('#fileImport')?.click();return}
    if(action==='legacy-import'){importLegacy();return}
    if(action==='delete-all'){if(!confirm('Delete ALL pain entries from this app? Export a backup first.')||!confirm('Are you sure? This cannot be undone.'))return;data.entries=[];save();render();notify('All pain entries deleted.');return}
  }
  function onInput(event){if(event.target.id==='leftPain'){$('#leftValue').textContent=event.target.value;updateAdvice()}if(event.target.id==='rightPain'){$('#rightValue').textContent=event.target.value;updateAdvice()}if(event.target.id==='journalText'){const n=event.target.value.trim().split(/\s+/).filter(Boolean).length;$('#wordCount').textContent=`${n} ${n===1?'word':'words'}`}}
  function onSubmit(event){if(event.target.id!=='painForm')return;event.preventDefault();const f=new FormData(event.target),date=String(f.get('date')||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return notify('Enter a valid date.');const existing=editingId?data.entries.find(e=>e.id===editingId):null;const entry=cleanEntry({id:existing?.id||identifier(),date,time:f.get('time'),left:f.get('left'),right:f.get('right'),context:f.get('context'),description:f.get('description'),stiffness:f.get('stiffness'),legacyId:existing?.legacyId});if(!entry)return notify('Could not process this entry.');if(existing){Object.assign(existing,entry)}else data.entries.push(entry);const ok=save();editingId=null;render();if(ok)notify('Pain entry saved.')}
  async function onChange(event){if(event.target.id!=='fileImport')return;const f=event.target.files?.[0];if(!f)return;try{if(f.size>5_000_000)throw Error('File is too large');const raw=JSON.parse(await f.text());if(!Array.isArray(raw.entries)||raw.entries.length>10000)throw Error('Not a valid My Knee backup');const entries=raw.entries.map(cleanEntry);if(entries.some(e=>!e))throw Error('Backup contains invalid entries');if(!confirm('Import this backup? Your current pain entries will be replaced.'))return;data={version:1,entries,legacyImported:!!raw.legacyImported};editingId=null;save();render();notify(`${entries.length} pain entries imported.`)}catch(e){notify(`Import failed: ${e.message}`)}finally{event.target.value=''}}
  document.addEventListener('click',onClick);
  document.addEventListener('input',onInput);
  document.addEventListener('submit',onSubmit);
  document.addEventListener('change',onChange);
  window.addEventListener('beforeunload',event=>{if(page==='journal'&&$('#journalText')?.value.trim()){event.preventDefault();event.returnValue=''}});
  window.addEventListener('pageshow',event=>{if(event.persisted&&page==='journal'){const el=$('#journalText');if(el){el.value='';$('#wordCount').textContent='0 words'}}});
  render();
  if('serviceWorker' in navigator&&location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
