<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mijn Knie">
<meta name="description" content="Privé pijndagboek en een schrijfplek voor JournalSpeak, zonder account.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Mijn Knie — Pijnlogboek & JournalSpeak</title>
<style>
:root{color-scheme:dark;--bg:#101b20;--panel:#19272d;--panel2:#203239;--line:#304349;--muted:#a4b9bc;--text:#f1f6f2;--accent:#a8e1b1;--accent2:#78bea2;--cream:#f5d9ac;--danger:#ffb4a9;--radius:19px}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1d3c39 0%,#101b20 48%) fixed;color:var(--text);line-height:1.5;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.layout{max-width:970px;margin:auto;padding:0 24px 132px}.header{background:#101b20ed;backdrop-filter:blur(14px);border-bottom:1px solid #2a4246;position:sticky;top:0;z-index:10}.header-inner{max-width:970px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{height:44px;width:44px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#b2e8b1,#68b6a2);color:#152823;font-size:24px;font-weight:850}.brand-title{font-weight:850;letter-spacing:-.5px;font-size:19px}.brand-caption{font-size:11px;color:var(--muted);margin-top:-3px}.privacy{color:#c0dace;border:1px solid #46685a;background:#21352f;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:750}.hero{padding:37px 0 24px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:850}.hero h1{font-size:clamp(29px,4.6vw,45px);line-height:1.07;letter-spacing:-1.7px;margin:8px 0 12px}.hero p{margin:0;color:var(--muted);max-width:650px;font-size:14px}.tabs{display:flex;gap:7px;padding:6px;background:#17272d;border:1px solid var(--line);border-radius:17px;margin:8px 0 23px;flex-wrap:wrap}.tab{flex:1;min-width:130px;border:0;background:transparent;color:var(--muted);padding:12px 13px;border-radius:12px;font-size:13px;font-weight:800}.tab.active{background:#b2e1b5;color:#14251f;box-shadow:0 5px 16px #0004}.twocol{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.85fr);align-items:start;gap:19px}.card{background:linear-gradient(140deg,#1c2b30,#19262b);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 12px 35px #0001}.card h2{font-size:20px;letter-spacing:-.5px;margin:0 0 7px}.card h3{font-size:16px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:3px 0 18px}.field{margin:17px 0}.field label,.field legend{display:block;font-size:12px;font-weight:780;margin-bottom:9px;color:#dae9e5}.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input,.textarea,.select{display:block;width:100%;padding:13px 14px;background:#122127;border:1px solid #455b61;border-radius:12px;color:var(--text);min-height:44px}.textarea{min-height:124px;resize:vertical;line-height:1.65}.textarea.journal{min-height:330px;font-size:15px;padding:18px;line-height:1.75;border-color:#58766a;background:#12221f}.input::placeholder,.textarea::placeholder{color:#8fa5a8}.pain-row{background:#14242a;border:1px solid #32494f;padding:15px;border-radius:14px;margin:10px 0}.pain-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;font-size:14px;font-weight:720}.score{font-size:22px;font-weight:850;color:var(--accent);font-variant-numeric:tabular-nums}.range{width:100%;accent-color:#9de0b4}.range-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.btn{border:0;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 17px;background:var(--accent);color:#14251f;border-radius:12px;font-weight:850;font-size:13px}.btn:hover{filter:brightness(1.04)}.btn.secondary{background:#293d41;color:#e1eeeb;border:1px solid #4a6364}.btn.ghost{background:transparent;color:var(--muted);border:1px solid #475a5c}.btn.danger{background:#402d32;color:#ffc8c2;border:1px solid #81565a}.btn.small{padding:9px 11px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.btn.fill{width:100%}.notice{padding:14px 15px;border:1px solid #365b4b;background:#20372f;border-radius:13px;font-size:12px;color:#d0e9d6;line-height:1.6}.notice.warning{background:#312e29;border-color:#716046;color:#edddbe}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.stat{padding:14px;background:#14252a;border:1px solid #35474d;border-radius:13px}.stat strong{display:block;font-size:24px;line-height:1.1;letter-spacing:-.5px}.stat span{font-size:11px;color:var(--muted)}.mini-note{font-size:11px;color:var(--muted);line-height:1.6}.entry{padding:15px 0;border-top:1px solid #2c4246}.entry:first-child{border-top:0}.entry-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.entry-title strong{font-size:13px}.entry-meta{color:var(--muted);font-size:11px;margin-top:4px}.entry-note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#d8e5e1;line-height:1.55;margin:9px 0}.entry-actions{display:flex;gap:11px;margin-top:9px}.linkbtn{background:transparent;border:0;padding:4px 0;color:var(--accent);font-size:12px;font-weight:790}.linkbtn.dangertext{color:var(--danger)}.tag{font-size:11px;display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:30px;background:#29423b;color:#b5e6c7;font-weight:800}.empty{padding:29px 16px;text-align:center;border:1px dashed #4f6366;border-radius:15px;color:var(--muted);font-size:13px}.journal-top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:15px}.secret{display:flex;align-items:center;gap:8px;color:#d0ebd6;font-size:12px;font-weight:750}.promptbox{background:#22332f;border-left:3px solid var(--accent);padding:16px;border-radius:0 12px 12px 0;margin-bottom:17px}.promptbox strong{font-size:13px}.promptbox p{margin:5px 0 0;font-size:13px;color:#c3d7cc}.wordcount{font-size:11px;color:var(--muted);margin:8px 0 15px;text-align:right}.journal-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.journal-words{color:var(--muted);font-size:12px}.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.graph{width:100%;height:auto;display:block;max-height:230px}.progress-line{stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-top:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.footnote{margin:24px auto 0;font-size:12px;color:#a0b8b4;line-height:1.7}.footer{margin-top:22px;padding:16px 0;border-top:1px solid var(--line);font-size:11px;color:#90aaa7}.toast{position:fixed;z-index:100;bottom:23px;left:50%;transform:translateX(-50%);background:#c6e8bd;color:#12231c;padding:12px 17px;border-radius:12px;font-size:12px;font-weight:850;box-shadow:0 12px 38px #0009;max-width:min(90vw,450px);text-align:center}.inline-icon{font-size:17px}.settings-box{margin:12px 0 22px;padding:17px;background:#15252a;border:1px solid #30474e;border-radius:14px}.settings-box h3{margin:0 0 8px}.tiny{font-size:11px;color:var(--muted)}.settings-box .actions{margin-top:15px}.mobile-nav{display:none}.hide{display:none!important}@media(max-width:700px){.layout{padding:0 16px 110px}.header-inner{padding:12px 16px}.privacy{font-size:10px}.hero{padding:29px 0 20px}.twocol,.history-grid{grid-template-columns:1fr}.card{padding:18px}.tabs{display:none}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);z-index:40;background:#132327f7;backdrop-filter:blur(16px);border-top:1px solid #3a4e52;padding:8px 5px calc(10px + env(safe-area-inset-bottom))}.mobile-nav .tab{padding:10px 5px;min-width:0;font-size:10px;display:flex;flex-direction:column;gap:3px}.mobile-nav .tab .ico{font-size:17px}.mobile-nav .tab.active{box-shadow:none}.textarea.journal{min-height:310px}.card h2{font-size:19px}}@media(max-width:360px){.fields2{grid-template-columns:1fr}.brand-title{font-size:17px}.privacy{display:none}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="brand"><div class="logo" aria-hidden="true">⌁</div><div><div class="brand-title">MIJN KNIE</div><div class="brand-caption">Ruimte voor herstel</div></div></div><span class="privacy">◈ Alleen op dit apparaat</span></div></header>
<main class="layout">
<section class="hero"><span class="eyebrow" id="eyebrow">PIJNDAGBOEK</span><h1 id="pageTitle">Hoe voelen je knieën vandaag?</h1><p id="pageDescription">Houd bij wat je voelt. Korte notities zijn genoeg — je hoeft niets perfect bij te houden.</p></section>
<nav class="tabs" aria-label="Pagina's"><button type="button" class="tab active" data-tab="log">Pijn noteren</button><button type="button" class="tab" data-tab="journal">JournalSpeak</button><button type="button" class="tab" data-tab="history">Historie</button><button type="button" class="tab" data-tab="settings">Instellingen</button></nav>
<div id="view" aria-live="off"></div>
<div class="footer">Mijn Knie · privé dagboek · geen account, geen tracking en geen automatische cloudopslag</div>
</main>
<nav class="mobile-nav" aria-label="Mobiele navigatie"><button type="button" class="tab active" data-tab="log"><span class="ico">◉</span>Pijn</button><button type="button" class="tab" data-tab="journal"><span class="ico">✎</span>Schrijven</button><button type="button" class="tab" data-tab="history"><span class="ico">▥</span>Historie</button><button type="button" class="tab" data-tab="settings"><span class="ico">⚙</span>Instellingen</button></nav>
<script>
'use strict';
(()=>{
 const STORE='mijn-knie-journal-v1', OLD='mijn-gym-state-v1';
 const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pad=n=>String(n).padStart(2,'0');
 const today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
 const nowTime=()=>{let d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
 const identifier=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
 const fmtDate=d=>{let parts=String(d||'').split('-').map(Number);let dt=parts.length===3?new Date(parts[0],parts[1]-1,parts[2]):new Date();return dt.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})};
 const pain=n=>Math.max(0,Math.min(10,Math.round(Number(n)||0)));
 let data={version:1,entries:[],legacyImported:false};
 try{let raw=localStorage.getItem(STORE);if(raw){let x=JSON.parse(raw);if(Array.isArray(x.entries)){data={version:1,entries:x.entries,legacyImported:!!x.legacyImported}}}}catch(e){}
 let page='log',editingId=null;
 function save(){try{localStorage.setItem(STORE,JSON.stringify(data));return true}catch(e){notify('Opslaan mislukt. Controleer opslagruimte of browserinstellingen.');return false}}
 function notify(message){$('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=message;document.body.appendChild(n);setTimeout(()=>n.remove(),4200)}
 function sorted(){return [...data.entries].sort((a,b)=>(String(b.date||'')+String(b.time||'')).localeCompare(String(a.date||'')+String(a.time||'')))}
 function countWeek(){let cutoff=new Date();cutoff.setDate(cutoff.getDate()-6);const base=`${cutoff.getFullYear()}-${pad(cutoff.getMonth()+1)}-${pad(cutoff.getDate())}`;return data.entries.filter(e=>e.date>=base).length}
 function entryCard(e,withActions=true){return `<article class="entry"><div class="entry-title"><strong>${esc(fmtDate(e.date))}${e.time?` · ${esc(e.time)}`:''}</strong><span class="tag">L ${pain(e.left)}/10 · R ${pain(e.right)}/10</span></div>${e.context?`<div class="entry-meta">${esc(e.context)}</div>`:''}${e.description?`<div class="entry-note">${esc(e.description)}</div>`:''}${e.stiffness!==null&&e.stiffness!==undefined&&e.stiffness!==''?`<div class="entry-meta">Ochtendstijfheid: ${Number(e.stiffness)} min</div>`:''}${withActions?`<div class="entry-actions"><button type="button" class="linkbtn" data-action="edit" data-id="${esc(e.id)}">Bewerken</button><button type="button" class="linkbtn dangertext" data-action="remove" data-id="${esc(e.id)}">Verwijderen</button></div>`:''}</article>`}
 function renderLog(){const recent=sorted();const current=editingId?data.entries.find(e=>e.id===editingId):null;
 return `<div class="twocol"><section class="card"><h2>${current?'Notitie bewerken':'Nieuwe pijnnotitie'}</h2><p class="sub">Noteer wat je merkt, bijvoorbeeld bij traplopen, na padel of 's ochtends. De notitie wordt pas bewaard wanneer je op opslaan drukt.</p><form id="painForm"><div class="fields2"><div class="field"><label for="logDate">Datum</label><input class="input" id="logDate" name="date" type="date" required value="${esc(current?.date||today())}"></div><div class="field"><label for="logTime">Tijd</label><input class="input" id="logTime" name="time" type="time" value="${esc(current?.time||nowTime())}"></div></div>
 <div class="pain-row"><div class="pain-head"><label for="leftPain">Linkerknie</label><output class="score" id="leftValue">${pain(current?.left)}</output></div><input class="range" id="leftPain" name="left" type="range" min="0" max="10" step="1" value="${pain(current?.left)}"><div class="range-ends"><span>0 · Geen pijn</span><span>10 · Ergste pijn</span></div></div>
 <div class="pain-row"><div class="pain-head"><label for="rightPain">Rechterknie</label><output class="score" id="rightValue">${pain(current?.right)}</output></div><input class="range" id="rightPain" name="right" type="range" min="0" max="10" step="1" value="${pain(current?.right)}"><div class="range-ends"><span>0 · Geen pijn</span><span>10 · Ergste pijn</span></div></div>
 <div class="field"><label for="context">Wanneer merk je de pijn? (optioneel)</label><select class="select" id="context" name="context"><option value="">Kies een situatie</option>${['Bij traplopen','Na krachttraining','Tijdens of na padel','Bij opstaan','In rust','Anders'].map(x=>`<option value="${esc(x)}" ${current?.context===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
 <div class="field"><label for="description">Wat voel je precies?</label><textarea class="textarea" id="description" name="description" maxlength="4000" placeholder="Bijv. stekende pijn onder mijn rechterknieschijf bij trap aflopen. Het was vanochtend stijver dan gisteren…">${esc(current?.description||'')}</textarea></div>
 <div class="field"><label for="stiffness">Ochtendstijfheid in minuten (optioneel)</label><input class="input" id="stiffness" type="number" name="stiffness" min="0" max="600" inputmode="numeric" placeholder="Bijv. 10" value="${current?.stiffness??''}"></div>
 <div class="actions"><button class="btn" type="submit">${current?'Wijziging opslaan':'Pijnnotitie opslaan'} <span aria-hidden="true">→</span></button>${current?'<button class="btn ghost" type="button" data-action="cancel-edit">Annuleren</button>':''}</div></form></section>
 <aside class="card"><span class="eyebrow">JOUW OVERZICHT</span><h2 style="margin-top:8px">Stap voor stap</h2><div class="stat-grid"><div class="stat"><strong>${data.entries.length}</strong><span>notities bewaard</span></div><div class="stat"><strong>${countWeek()}</strong><span>afgelopen 7 dagen</span></div></div><div class="notice">Je pijnnotities worden <strong>op dit apparaat</strong> opgeslagen. Maak geregeld een back-up via Instellingen. JournalSpeak-tekst wordt juist niet bewaard.</div><h3 style="margin-top:23px">Laatste notitie</h3>${recent.length?entryCard(recent[0],false):'<div class="empty">Nog geen pijnnotities. Begin met één korte registratie.</div>'}<button class="btn secondary fill small" type="button" data-action="goto" data-page="history" style="margin-top:15px">Bekijk de historie</button></aside></div>`}
 function renderJournal(){return `<div class="twocol"><section class="card"><div class="journal-top"><div><h2>JournalSpeak</h2><p class="sub" style="margin:0">Vrij schrijven, daarna loslaten.</p></div><div class="secret">◈ Niet opgeslagen</div></div><div class="promptbox"><strong>Waar wil je vandaag ruimte aan geven?</strong><p>Schrijf over gevoelens, gedachten, frustratie of zorgen — zonder jezelf te corrigeren. Je hoeft het niet terug te lezen.</p></div><label for="journalText" class="eyebrow" style="display:block;margin-bottom:10px">JOUW PRIVÉ SCHRIJFRUIMTE</label><textarea id="journalText" class="textarea journal" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="Schrijf wat er in je opkomt. Je hoeft niets uit te leggen of mooi te formuleren…" aria-describedby="journalPrivacy"></textarea><div id="wordCount" class="wordcount">0 woorden</div><div class="journal-foot"><button type="button" class="btn danger" data-action="clear-journal">✕ Wis deze tekst</button><span class="journal-words">Niet in je historie · Niet in je back-up</span></div><p id="journalPrivacy" class="mini-note" style="margin-top:16px">Deze app slaat je JournalSpeak-tekst nergens op. Als je hem wist of deze pagina verlaat, kun je hem niet via de app terughalen. De browser of je toetsenbord kan eigen invoerfuncties hebben.</p></section>
 <aside class="card"><span class="eyebrow">EEN KLEINE OEFENING</span><h2 style="margin-top:9px">Schrijf zonder oordeel</h2><p class="sub">JournalSpeak is bedoeld als vrije, persoonlijke reflectie. Het hoeft niet iedere dag en je hoeft niets te forceren.</p><div class="settings-box"><h3>Als je niet weet wat je wilt schrijven</h3><p class="sub" style="margin-bottom:0">• Wat irriteert of bezighoudt me?<br>• Wat heb ik vandaag voor mezelf gehouden?<br>• Wat heb ik vandaag nodig?</p></div><div class="notice warning">Schrijven kan steun bieden bij omgaan met pijn of spanning, maar bewijst niet dat je knieklachten psychisch zijn. Het vervangt geen beoordeling of behandeling van een knieprobleem.</div></aside></div>`}
 function chart(){let entries=sorted().slice(0,14).reverse();if(entries.length<2)return '<div class="empty">Na twee registraties kan hier een trend verschijnen.</div>';const w=660,h=210,left=34,right=630,top=18,bottom=173;const x=i=>left+(right-left)*(i/Math.max(1,entries.length-1));const y=v=>bottom-(bottom-top)*pain(v)/10;const points=k=>entries.map((e,i)=>`${x(i)},${y(e[k])}`).join(' ');return `<svg class="graph" viewBox="0 0 ${w} ${h}" role="img" aria-label="Pijnscores van laatste ${entries.length} metingen"><line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}" stroke="#577176"/><line x1="${left}" y1="${y(5)}" x2="${right}" y2="${y(5)}" stroke="#577176" stroke-dasharray="5 5"/><text x="4" y="${y(10)+4}" font-size="12" fill="#a4b9bc">10</text><text x="11" y="${y(5)+4}" font-size="12" fill="#a4b9bc">5</text><text x="11" y="${bottom+4}" font-size="12" fill="#a4b9bc">0</text><polyline class="progress-line" stroke="#a8e1b1" points="${points('left')}"/><polyline class="progress-line" stroke="#f5d9ac" points="${points('right')}"/>${entries.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.left)}" r="4" fill="#a8e1b1"/><circle cx="${x(i)}" cy="${y(e.right)}" r="4" fill="#f5d9ac"/>`).join('')}<text x="${left}" y="202" font-size="11" fill="#a4b9bc">${esc(fmtDate(entries[0].date))}</text><text x="${right}" y="202" text-anchor="end" font-size="11" fill="#a4b9bc">${esc(fmtDate(entries.at(-1).date))}</text></svg><div class="legend"><span><i class="dot" style="background:#a8e1b1"></i>Links</span><span><i class="dot" style="background:#f5d9ac"></i>Rechts</span></div><p class="mini-note">Laatste ${entries.length} metingen. De grafiek helpt patronen herkennen, maar verklaart niet waardoor pijn ontstaat.</p>`}
 function renderHistory(){return `<div class="twocol"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Jouw pijnnotities</h2><span class="tag">${data.entries.length} totaal</span></div>${data.entries.length?sorted().map(e=>entryCard(e,true)).join(''):'<div class="empty">Je hebt nog geen pijnnotities opgeslagen.</div>'}</section><aside class="card"><h2>Pijnverloop</h2><p class="sub">Overzicht van je laatste registraties voor links en rechts.</p>${chart()}<button class="btn secondary fill small" type="button" data-action="goto" data-page="log" style="margin-top:17px">+ Nieuwe pijnnotitie</button></aside></div>`}
 function oldChecks(){try{let o=JSON.parse(localStorage.getItem(OLD)||'{}');return Array.isArray(o.checks)?o.checks:[]}catch(e){return []}}
 function renderSettings(){let count=oldChecks().length;return `<div class="twocol"><section class="card"><h2>Back-up en herstel</h2><p class="sub">Je pijnnotities staan lokaal in je browser. Exporteer ze regelmatig als back-up; er is geen cloudaccount of automatische synchronisatie.</p><div class="settings-box"><h3>Jouw gegevens bewaren</h3><p class="sub">De JSON-back-up bevat je opgeslagen pijnnotities, maar <strong>nooit je JournalSpeak-tekst</strong>.</p><div class="actions"><button type="button" class="btn" data-action="export-json">↓ Download back-up (JSON)</button><button type="button" class="btn secondary" data-action="export-csv">↓ Exporteer als CSV</button></div></div><div class="settings-box"><h3>Back-up terugzetten</h3><p class="sub">Je kunt een eerder gedownloade JSON-back-up weer importeren. Dit vervangt de huidige pijnnotities op dit apparaat.</p><button type="button" class="btn secondary" data-action="import">↑ Importeer JSON</button><input class="hide" type="file" id="fileImport" accept=".json,application/json"></div><div class="settings-box"><h3>Oude kniechecks overnemen</h3><p class="sub">Uit je vorige Gym Tracker kan ik alleen de kniechecks overnemen, zonder trainingsgegevens te veranderen of te verwijderen.</p>${count?`<button class="btn secondary" type="button" data-action="legacy-import">Importeer ${count} oude kniechecks</button>`:'<p class="mini-note">Geen oude kniechecks gevonden in deze browser.</p>'}</div></section><aside class="card"><span class="eyebrow">PRIVACY</span><h2 style="margin-top:7px">Jij houdt de controle</h2><div class="notice">Geen account, geen verbinding met een externe database en geen automatische overdracht naar Strong of GitHub. Alleen de websitecode staat op GitHub.</div><p class="sub" style="margin-top:15px">Je gegevens blijven meestal aanwezig bij updates op hetzelfde adres en in dezelfde browser. Bij wissen van browserdata of verlies van je telefoon kan de lokale historie verdwijnen.</p><h3 style="margin-top:21px">Gegevens verwijderen</h3><p class="sub">Dit wist alleen de pijnnotities van deze nieuwe app. De oude Gym Tracker-opslag wordt niet aangeraakt.</p><button type="button" class="btn danger small" data-action="delete-all">Wis alle pijnnotities</button></aside></div>`}
 const pageMeta={log:['PIJNDAGBOEK','Hoe voelen je knieën vandaag?','Houd bij wat je voelt. Korte notities zijn genoeg — je hoeft niets perfect bij te houden.'],journal:['JOURNALSPEAK','Schrijf het van je af.','Een privé plek om vrij te schrijven, zonder dat de tekst wordt bewaard.'],history:['HISTORIE','Je herstel in je eigen woorden.','Bekijk je eerdere notities en hoe de pijnscores zich ontwikkelen.'],settings:['INSTELLINGEN','Jouw gegevens, jouw keuze.','Maak een back-up en bepaal wat je bewaart of verwijdert.']};
 function render(){const [eye,title,desc]=pageMeta[page];$('#eyebrow').textContent=eye;$('#pageTitle').textContent=title;$('#pageDescription').textContent=desc;$$('[data-tab]').forEach(n=>{const active=n.dataset.tab===page;n.classList.toggle('active',active);n.setAttribute('aria-current',active?'page':'false')});$('#view').innerHTML=({log:renderLog,journal:renderJournal,history:renderHistory,settings:renderSettings})[page]();}
 function navigate(target){if(!pageMeta[target]||target===page)return;const text=$('#journalText');if(page==='journal'&&text?.value.trim()&&!confirm('JournalSpeak-tekst is niet opgeslagen en verdwijnt als je deze pagina verlaat. Doorgaan?'))return;page=target;render();window.scrollTo(0,0)}
 function download(filename,body,type){const url=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
 function csvField(v){let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
 function jsonExport(){download(`mijn-knie-backup-${today()}.json`,JSON.stringify({...data,exportedAt:new Date().toISOString(),app:'mijn-knie-v2'},null,2),'application/json');notify('Back-up gedownload. Bewaar hem op een veilige plek.')}
 function csvExport(){const headers=['Datum','Tijd','Linkerknie 0-10','Rechterknie 0-10','Situatie','Pijnbeschrijving','Stijfheid (min)'];const lines=[headers.map(csvField).join(';'),...sorted().map(x=>[x.date,x.time,x.left,x.right,x.context,x.description,x.stiffness].map(csvField).join(';'))];download(`mijn-knie-${today()}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');notify('CSV-bestand gedownload.')}
 function cleanEntry(raw){if(!raw||typeof raw!=='object')return null;const d=String(raw.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;return {id:String(raw.id||identifier()).slice(0,120),date:d,time:/^\d{2}:\d{2}$/.test(raw.time||'')?raw.time:'',left:pain(raw.left),right:pain(raw.right),context:String(raw.context||'').slice(0,120),description:String(raw.description||'').slice(0,4000),stiffness:raw.stiffness==null||raw.stiffness===''?null:Math.max(0,Math.min(600,Number(raw.stiffness)||0)),legacyId:raw.legacyId?String(raw.legacyId):undefined};}
 function importLegacy(){const checks=oldChecks();if(!checks.length)return notify('Geen oude kniechecks gevonden.');const existing=new Set(data.entries.map(e=>e.legacyId).filter(Boolean));let added=0;for(const [i,c] of checks.entries()){const legacyId='mijn-gym:'+String(c.id||c.date||i);if(existing.has(legacyId))continue;const entry=cleanEntry({id:identifier(),date:c.date,time:'',left:c.left,right:c.right,description:c.notes||'',context:'Overgenomen uit Gym Tracker',stiffness:c.stiffness,legacyId});if(entry){data.entries.push(entry);added++}}data.legacyImported=true;save();render();notify(`${added} oude kniechecks overgenomen. Oude trainingsgegevens blijven staan.`)}
 function onClick(ev){const tab=ev.target.closest('[data-tab]');if(tab){navigate(tab.dataset.tab);return}const btn=ev.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;
 if(action==='goto'){navigate(btn.dataset.page);return}
 if(action==='clear-journal'){let j=$('#journalText');if(!j)return;j.value='';$('#wordCount').textContent='0 woorden';j.focus();notify('Tekst gewist. Deze tekst is niet opgeslagen.');return}
 if(action==='edit'){editingId=id;page='log';render();window.scrollTo(0,0);$('#description')?.focus();return}
 if(action==='cancel-edit'){editingId=null;render();return}
 if(action==='remove'){if(!confirm('Deze pijnnotitie verwijderen?'))return;data.entries=data.entries.filter(e=>e.id!==id);save();render();notify('Pijnnotitie verwijderd.');return}
 if(action==='export-json'){jsonExport();return}
 if(action==='export-csv'){csvExport();return}
 if(action==='import'){$('#fileImport')?.click();return}
 if(action==='legacy-import'){importLegacy();return}
 if(action==='delete-all'){if(!confirm('Alle pijnnotities uit deze app wissen? Maak eerst een back-up.')||!confirm('Weet je het zeker? Dit kan niet ongedaan worden gemaakt.'))return;data.entries=[];save();render();notify('Alle pijnnotities van deze app verwijderd.');return}
 }
 function onInput(ev){if(ev.target.id==='leftPain')$('#leftValue').textContent=ev.target.value;if(ev.target.id==='rightPain')$('#rightValue').textContent=ev.target.value;if(ev.target.id==='journalText'){let n=ev.target.value.trim().split(/\s+/).filter(Boolean).length;$('#wordCount').textContent=`${n} ${n===1?'woord':'woorden'}`}}
 function onSubmit(ev){if(ev.target.id!=='painForm')return;ev.preventDefault();const f=new FormData(ev.target),date=String(f.get('date')||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return notify('Vul een geldige datum in.');let existing=editingId?data.entries.find(e=>e.id===editingId):null;let n=cleanEntry({id:existing?.id||identifier(),date,time:f.get('time'),left:f.get('left'),right:f.get('right'),context:f.get('context'),description:f.get('description'),stiffness:f.get('stiffness'),legacyId:existing?.legacyId});if(!n)return notify('Notitie kon niet worden verwerkt.');if(existing){Object.assign(existing,n)}else data.entries.push(n);const ok=save();editingId=null;render();if(ok)notify('Pijnnotitie opgeslagen.');}
 async function onChange(ev){if(ev.target.id!=='fileImport')return;const f=ev.target.files?.[0];if(!f)return;try{if(f.size>5_000_000)throw Error('Bestand is te groot');const raw=JSON.parse(await f.text());if(!Array.isArray(raw.entries)||raw.entries.length>10000)throw Error('Geen geldige Mijn Knie-back-up');const entries=raw.entries.map(cleanEntry);if(entries.some(e=>!e))throw Error('Ongeldige gegevens in back-up');if(!confirm('Back-up importeren? Je huidige pijnnotities worden vervangen.'))return;data={version:1,entries,legacyImported:!!raw.legacyImported};editingId=null;save();render();notify(`${entries.length} pijnnotities geïmporteerd.`)}catch(e){notify(`Importeren mislukt: ${e.message}`)}finally{ev.target.value=''}}
 document.addEventListener('click',onClick);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);document.addEventListener('change',onChange);
 window.addEventListener('beforeunload',event=>{if(page==='journal'&&$('#journalText')?.value.trim()){event.preventDefault();event.returnValue=''}});
 window.addEventListener('pageshow',event=>{if(event.persisted&&page==='journal'){const e=$('#journalText');if(e){e.value='';$('#wordCount').textContent='0 woorden'}}});
 render();
 if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
